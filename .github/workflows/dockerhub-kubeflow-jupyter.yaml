name: kubeflow-jupyter-base
 
on:
  push:
    branches:
      - 'main'

jobs:
  build-and-push:
    name: Publish Docker image for kubeflow-jupyter-base
    runs-on: ubuntu-22.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changes in src
        id: changes
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch --no-tags --prune origin "${{ github.ref }}" || true

          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- src | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build and push Docker image
        if: steps.changes.outputs.changed == 'true'
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/kubeflow-jupyter-base
        run: |
          cd src

          SHORT_SHA=${GITHUB_SHA::7}

          docker build \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${SHORT_SHA}" \
            -f Dockerfile_base \
            .

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${SHORT_SHA}"